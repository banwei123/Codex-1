<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>keep-awake 控制</title>
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 16px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4caf50;
      color: #fff;
      transition: background 0.2s ease;
    }
    button.stop {
      background: #e53935;
    }
    button:disabled {
      background: #9e9e9e;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
    }
    .error {
      margin-top: 8px;
      padding: 8px;
      border-radius: 6px;
      background: #ffebee;
      color: #c62828;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>keep-awake</h1>
  <button id="toggleButton">启动</button>
  <div class="status" id="statusText">当前：已关闭</div>
  <div class="error" id="errorText"></div>
  <script src="popup.js"></script>
</body>
</html>
